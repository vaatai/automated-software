services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: automated_software
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - screenshots:/app/screenshots

  celery_worker:
    build: .
    command: celery -A configs.celery_app worker --loglevel=info --concurrency=5
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - screenshots:/app/screenshots

  celery_beat:
    build: .
    command: celery -A configs.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  screenshots:
