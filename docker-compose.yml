services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: automated_software
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - screenshots:/app/screenshots

  celery_worker:
    build: .
    command: >
      celery -A configs.celery_app worker
      --loglevel=info
      --concurrency=5
      --queues=registrations,registrations.high,registrations.low
      --max-tasks-per-child=50
      --max-memory-per-child=512000
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - screenshots:/app/screenshots
      - browser_logs:/app/browser_logs

  celery_dlq_worker:
    build: .
    command: >
      celery -A configs.celery_app worker
      --loglevel=info
      --concurrency=2
      --queues=dead_letter,monitoring
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  celery_beat:
    build: .
    command: celery -A configs.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis

  flower:
    build: .
    command: celery -A configs.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      - redis

volumes:
  postgres_data:
  screenshots:
  browser_logs:
