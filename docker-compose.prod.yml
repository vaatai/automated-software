# ---------------------------------------------------------------------------
# Production docker-compose — Nginx reverse proxy, resource limits, scaling
# Usage: docker compose -f docker-compose.prod.yml up -d
# ---------------------------------------------------------------------------
services:

  # ── infrastructure ───────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-automated_software}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-automated_software}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - backend

  # ── application ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - screenshots:/app/screenshots
      - html_snapshots:/app/html_snapshots
      - browser_logs:/app/browser_logs
      - debug_reports:/app/debug_reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    networks:
      - backend
      - frontend

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: >
      celery -A configs.celery_app worker
      --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-5}
      --queues=registrations,registrations.high,registrations.low
      --max-tasks-per-child=50
      --max-memory-per-child=512000
      --without-heartbeat
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - screenshots:/app/screenshots
      - html_snapshots:/app/html_snapshots
      - browser_logs:/app/browser_logs
      - debug_reports:/app/debug_reports
    healthcheck:
      test: ["CMD-SHELL", "celery -A configs.celery_app inspect ping --timeout 5 2>/dev/null | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 30s
        order: stop-first
    networks:
      - backend

  celery_dlq_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: >
      celery -A configs.celery_app worker
      --loglevel=info
      --concurrency=2
      --queues=dead_letter,monitoring
      --without-heartbeat
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A configs.celery_app inspect ping --timeout 5 2>/dev/null | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - backend

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: celery -A configs.celery_app beat --loglevel=info --pidfile /tmp/celerybeat.pid
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    networks:
      - backend

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: celery -A configs.celery_app flower --port=5555 --url_prefix=flower
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/flower/api/workers"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - backend
      - frontend

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
      - HOSTNAME=0.0.0.0
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASS=${DASHBOARD_PASS:-autoreg2024}
      - SECRET_KEY=${SECRET_KEY:-}
    volumes:
      - dashboard_data:/app/.data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); http.get('http://0.0.0.0:3000/', r => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - frontend

  # ── reverse proxy ────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    networks:
      - frontend
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  screenshots:
  html_snapshots:
  browser_logs:
  debug_reports:
  dashboard_data:
