# Redis production configuration
# Optimized for Celery broker + result backend

# ── persistence ────────────────────────────────────────────
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

# ── memory ─────────────────────────────────────────────────
maxmemory 512mb
maxmemory-policy allkeys-lru

# ── networking ─────────────────────────────────────────────
bind 0.0.0.0
protected-mode no
tcp-backlog 511
timeout 300
tcp-keepalive 60

# ── logging ────────────────────────────────────────────────
loglevel notice
